[package]
name = "invporis"
version = "0.1.0"
edition = "2024"
description = "Investment portfolio tool"
license = "MIT"
repository = "https://github.com/Casper-Olsen/invporis"
categories = ["command-line-utilities", "finance"]
keywords = ["cli"]

[dependencies]
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
csv = "1.4.0"
directories = "6.0.0"
encoding_rs = "0.8.35"
env_logger = "0.11.11"
log = "0.4.33"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "chrono"] }
rust_decimal = { version = "1.42.1", default-features = false, features = ["macros", "serde-with-str", "serde-with-arbitrary-precision", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
